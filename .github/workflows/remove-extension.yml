name: Remove Extensions

on:
  workflow_dispatch:
    inputs:
      extension_names:
        description: "Enter extension names separated by spaces"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert space-separated list to names.txt
        run: |
          echo "${{ github.event.inputs.extension_names }}" \
            | tr ' ' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            > names.txt

      - name: Fuzzy match names to actual extension-list.txt entries
        run: |
          rm -f resolved.txt
          touch resolved.txt

          while IFS= read -r INPUT; do
            MATCH=$(grep -i "$INPUT" extension-list.txt | head -n 1)

            if [ -z "$MATCH" ]; then
              echo "No fuzzy match found for: $INPUT"
              exit 1
            fi

            echo "$MATCH" >> resolved.txt
          done < names.txt

      - name: Remove extensions from index.json
        run: |
          cp index.json index.json.tmp
          while IFS= read -r NAME; do
            jq --arg NAME "$NAME" '
              .extensionList.extensions |= map(select(.name != $NAME))
            ' index.json.tmp > index.json.new
            mv index.json.new index.json.tmp
          done < resolved.txt
          mv index.json.tmp index.json

      - name: Remove extensions from index.min.json
        run: |
          cp index.min.json index.min.json.tmp
          while IFS= read -r NAME; do
            jq --arg NAME "$NAME" '
              map(select(.name != $NAME))
            ' index.min.json.tmp > index.min.json.new
            mv index.min.json.new index.min.json.tmp
          done < resolved.txt
          mv index.min.json.tmp index.min.json

      - name: Append removed names to blacklist
        run: |
          while IFS= read -r NAME; do
            if ! grep -Fxq "$NAME" blacklist.txt; then
              echo "$NAME" >> blacklist.txt
            fi
          done < resolved.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json blacklist.txt
          git commit -m "Removed extensions (fuzzy matched): $(tr '\n' ' ' < resolved.txt)" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
