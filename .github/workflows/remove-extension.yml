name: Remove Extension

on:
  workflow_dispatch:
    inputs:
      extension_name:
        description: "Type the extension name to remove (folder inside repo/)"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate extension
        run: |
          if [ ! -d "repo/${{ github.event.inputs.extension_name }}" ]; then
            echo "Extension not found: repo/${{ github.event.inputs.extension_name }}"
            exit 1
          fi

      - name: Remove extension folder
        run: |
          rm -rf "repo/${{ github.event.inputs.extension_name }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Removed extension: ${{ github.event.inputs.extension_name }}" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
