name: Remove Extension

on:
  workflow_dispatch:
    inputs:
      extension_name:
        description: "Choose an extension from extension-list.txt"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize extension name
        id: clean
        run: |
          CLEANED=$(echo "${{ github.event.inputs.extension_name }}" | xargs)
          echo "name=$CLEANED" >> $GITHUB_OUTPUT

      - name: Validate extension exists in list
        run: |
          if ! grep -Fxq "${{ steps.clean.outputs.name }}" extension-list.txt; then
            echo "Extension not found in extension-list.txt"
            exit 1
          fi

      - name: Remove extension from index.json
        run: |
          jq --arg NAME "${{ steps.clean.outputs.name }}" '
            .extensionList.extensions |= map(select(.name != $NAME))
          ' index.json > index.json.tmp
          mv index.json.tmp index.json

      - name: Remove extension from index.min.json
        run: |
          jq --arg NAME "${{ steps.clean.outputs.name }}" '
            .extensionList.extensions |= map(select(.name != $NAME))
          ' index.min.json > index.min.json.tmp
          mv index.min.json.tmp index.min.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json
          git commit -m "Removed extension: ${{ steps.clean.outputs.name }}" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
