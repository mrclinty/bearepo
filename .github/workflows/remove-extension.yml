name: Remove Extension

on:
  workflow_dispatch:
    inputs:
      extension_name:
        description: "Choose an extension from extension-list.txt"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize extension name
        id: clean
        run: |
          CLEANED=$(echo "${{ github.event.inputs.extension_name }}" | xargs)
          echo "name=$CLEANED" >> $GITHUB_OUTPUT

      - name: Validate extension exists in list
        run: |
          if ! grep -Fxq "${{ steps.clean.outputs.name }}" extension-list.txt; then
            echo "Extension not found in extension-list.txt"
            exit 1
          fi

      - name: Remove extension folder
        run: |
          rm -rf "repo/${{ steps.clean.outputs.name }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Removed extension: ${{ steps.clean.outputs.name }}" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
