name: Remove Extensions

on:
  workflow_dispatch:
    inputs:
      extension_names:
        description: "Enter one or more extension names (one per line)"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save names to file
        run: |
          echo "${{ github.event.inputs.extension_names }}" > names.txt
          sed -i 's/[[:space:]]*$//' names.txt

      - name: Validate all names exist
        run: |
          while IFS= read -r NAME; do
            if ! grep -Fxq "$NAME" extension-list.txt; then
              echo "Extension not found: $NAME"
              exit 1
            fi
          done < names.txt

      - name: Build jq filter
        id: build
        run: |
          FILTER=""
          while IFS= read -r NAME; do
            FILTER="$FILTER and .name != \"$NAME\""
          done < names.txt
          FILTER="${FILTER# and }"
          echo "filter=$FILTER" >> $GITHUB_OUTPUT

      - name: Remove extensions from index.json
        run: |
          jq ".extensionList.extensions |= map(select(${{ steps.build.outputs.filter }}))" index.json > index.json.tmp
          mv index.json.tmp index.json

      - name: Remove extensions from index.min.json
        run: |
          jq "map(select(${{ steps.build.outputs.filter }}))" index.min.json > index.min.json.tmp
          mv index.min.json.tmp index.min.json

      - name: Append removed names to blacklist
        run: |
          while IFS= read -r NAME; do
            if ! grep -Fxq "$NAME" blacklist.txt; then
              echo "$NAME" >> blacklist.txt
            fi
          done < names.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json blacklist.txt
          git commit -m "Removed extensions: $(tr '\n' ', ' < names.txt)" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
