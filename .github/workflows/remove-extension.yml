name: Remove Extensions

on:
  workflow_dispatch:
    inputs:
      extension_names:
        description: "Enter one or more extension names (one per line)"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save names to file
        run: |
          echo "${{ github.event.inputs.extension_names }}" > names.txt
          sed -i 's/[[:space:]]*$//' names.txt

      - name: Validate all names exist
        run: |
          while IFS= read -r NAME; do
            if ! grep -Fxq "$NAME" extension-list.txt; then
              echo "Extension not found: $NAME"
              exit 1
            fi
          done < names.txt

      - name: Remove extensions from index.json
        run: |
          jq '
            .extensionList.extensions |=
              map(select(.name as $n | (inputs | split("\n")) | index($n) | not))
          ' index.json names.txt > index.json.tmp
          mv index.json.tmp index.json

      - name: Remove extensions from index.min.json
        run: |
          jq '
            map(select(.name as $n | (inputs | split("\n")) | index($n) | not))
          ' index.min.json names.txt > index.min.json.tmp
          mv index.min.json.tmp index.min.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json
          git commit -m "Removed extensions: $(tr '\n' ', ' < names.txt)" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
