name: Remove Extensions

on:
  workflow_dispatch:
    inputs:
      extension_names:
        description: "Enter extension names separated by spaces"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert space-separated list to names.txt
        run: |
          echo "${{ github.event.inputs.extension_names }}" \
            | tr ' ' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            > names.txt

      - name: Validate all names exist
        run: |
          while IFS= read -r NAME; do
            if ! grep -Fxq "$NAME" extension-list.txt; then
              echo "Extension not found: $NAME"
              exit 1
            fi
          done < names.txt

      - name: Remove extensions from index.json
        run: |
          cp index.json index.json.tmp
          while IFS= read -r NAME; do
            jq --arg NAME "$NAME" '
              .extensionList.extensions |= map(select(.name != $NAME))
            ' index.json.tmp > index.json.new
            mv index.json.new index.json.tmp
          done < names.txt
          mv index.json.tmp index.json

