name: Build Extension Index

on:
  workflow_dispatch:
  push:
    paths:
      - "repo/approved.txt"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build index.json
        run: |
          echo "Building index.json..."

          # Load approved list
          mapfile -t APPROVED < repo/approved.txt

          # Start index.json
          echo '{' > repo/index.json
          echo '  "name": "BearRepo",' >> repo/index.json
          echo '  "badgeLabel": "BEAR",' >> repo/index.json
          echo '  "signingKey": "00000000000000000000000000000000",' >> repo/index.json
          echo '  "contact": {' >> repo/index.json
          echo '    "website": "https://github.com/mrclinty",' >> repo/index.json
          echo '    "discord": ""' >> repo/index.json
          echo '  },' >> repo/index.json
          echo '  "extensionList": {' >> repo/index.json
          echo '    "extensions": [' >> repo/index.json

          FIRST=true

          # Loop through all extension folders
          for FOLDER in repo/extensions/*; do
            MANIFEST="$FOLDER/manifest.json"

            if [ -f "$MANIFEST" ]; then
              NAME=$(jq -r '.name' "$MANIFEST")

              # Only include approved extensions
              if printf '%s\n' "${APPROVED[@]}" | grep -qxF "$NAME"; then

                PKG=$(jq -r '.pkg' "$MANIFEST")
                APK=$(jq -r '.apk' "$MANIFEST")
                JAR=$(jq -r '.apk' "$MANIFEST")
                ICON="$PKG.png"

                APK_URL="https://raw.githubusercontent.com/mrclinty/bearepo/repo/apk/$APK"
                ICON_URL="https://raw.githubusercontent.com/mrclinty/bearepo/repo/icon/$ICON"
                JAR_URL="https://raw.githubusercontent.com/mrclinty/bearepo/repo/jar/$JAR"

                if [ "$FIRST" = false ]; then
                  echo ',' >> repo/index.json
                fi
                FIRST=false

                jq -n \
                  --argjson man "$(cat "$MANIFEST")" \
                  --arg apkUrl "$APK_URL" \
                  --arg iconUrl "$ICON_URL" \
                  --arg jarUrl "$JAR_URL" \
                  '{
                    name: $man.name,
                    packageName: $man.pkg,
                    resources: {
                      apkUrl: $apkUrl,
                      iconUrl: $iconUrl,
                      jarUrl: $jarUrl
                    },
                    extensionLib: $man.extensionLib,
                    versionCode: ($man.version | tostring),
                    versionName: $man.versionName,
                    contentWarning: $man.contentWarning,
                    sources: $man.sources
                  }' >> repo/index.json
              fi
            fi
          done

          echo '    ]' >> repo/index.json
          echo '  }' >> repo/index.json
          echo '}' >> repo/index.json

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/index.json
          git commit -m "Updated index.json from approved list" || echo "No changes"

      - name: Pull latest changes
        run: |
          git pull --rebase origin repo || true

      - name: Push index.json
        run: |
          git push origin repo
