name: Sync Upstream (English + Multi Only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Pull upstream index files
        run: |
          git checkout upstream/repo -- index.json index.min.json index.pb repo.json

      - name: Debug index.json format
        run: |
          echo "GitHub Actions is reading this index.json:"
          head -n 30 index.json

      - name: Filter index.json (English + Multi only)
        run: |
          jq '
            .extensionList.extensions |= (
              .extensionList.extensions
              | map(
                  select(
                    (
                      .sources[]
                      | .language
                      | tostring
                      | ascii_downcase
                    ) as $lang
                    | $lang == "en"
                    or $lang == "english"
                    or $lang == "multi"
                    or $lang == "all"
                    or ($lang | startswith("en-"))
                  )
                )
            )
          ' index.json > index.json.new
          mv index.json.new index.json

      - name: Filter index.min.json (English + Multi only)
        run: |
          jq '
            map(
              select(
                (
                  .sources[]
                  | .language
                  | tostring
                  | ascii_downcase
                ) as $lang
                | $lang == "en"
                or $lang == "english"
                or $lang == "multi"
                or $lang == "all"
                or ($lang | startswith("en-"))
              )
            )
          ' index.min.json > index.min.json.new
          mv index.min.json.new index.min.json

      - name: Generate extension-list.txt
        run: |
          jq -r '
            .extensionList.extensions[]
            | select(
                (
                  .sources[]
                  | .language
                  | tostring
                  | ascii_downcase
                ) as $lang
                | $lang == "en"
                or $lang == "english"
                or $lang == "multi"
                or $lang == "all"
                or ($lang | startswith("en-"))
            )
            | .name
          ' index.json | sort -u > extension-list.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json extension-list.txt
          git commit -m "Filtered: English + Multi only" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
