name: Sync Upstream (English + Multi Only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream into repo
        run: |
          git merge upstream/main --allow-unrelated-histories -X theirs || true

      - name: Filter index.json (English + Multi only)
        run: |
          jq '
            .extensionList.extensions |=
              (
                .extensionList.extensions
                | map(
                    select(
                      (.lang | tostring | ascii_downcase) == "en" or
                      (.lang | tostring | ascii_downcase) == "english" or
                      (.lang | tostring | ascii_downcase) == "multi" or
                      (.lang | tostring | ascii_downcase) == "all" or
                      (.lang | tostring | ascii_downcase) == "" or
                      (.lang | tostring | ascii_downcase) == "null" or
                      (.lang | tostring | ascii_downcase | startswith("en-"))
                    )
                  )
              )
          ' index.json > index.json.new
          mv index.json.new index.json

      - name: Filter index.min.json (English + Multi only)
        run: |
          jq '
            map(
              select(
                (.lang | tostring | ascii_downcase) == "en" or
                (.lang | tostring | ascii_downcase) == "english" or
                (.lang | tostring | ascii_downcase) == "multi" or
                (.lang | tostring | ascii_downcase) == "all" or
                (.lang | tostring | ascii_downcase) == "" or
                (.lang | tostring | ascii_downcase) == "null" or
                (.lang | tostring | ascii_downcase | startswith("en-"))
              )
            )
          ' index.min.json > index.min.json.new
          mv index.min.json.new index.min.json

      - name: Update extension-list.txt
        run: |
          jq -r '
            .extensionList.extensions[]
            | select(
                (.lang | tostring | ascii_downcase) == "en" or
                (.lang | tostring | ascii_downcase) == "english" or
                (.lang | tostring | ascii_downcase) == "multi" or
                (.lang | tostring | ascii_downcase) == "all" or
                (.lang | tostring | ascii_downcase) == "" or
                (.lang | tostring | ascii_downcase) == "null" or
                (.lang | tostring | ascii_downcase | startswith("en-"))
            )
            | .name
          ' index.json | sort -u > extension-list.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json extension-list.txt
          git commit -m "Filtered: English + Multi only" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
