name: Sync Upstream (Filtered + Moderated)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Pull upstream index files
        run: |
          git checkout upstream/repo -- index.json index.min.json index.pb repo.json

      - name: Load moderation lists
        run: |
          touch approved.txt blacklist.txt pending.txt

      - name: Filter index.json (English + Multi only)
        run: |
          jq '
            .extensionList.extensions =
              (
                .extensionList.extensions
                | map(
                    select(
                      (
                        .sources[]
                        | .language
                        | ascii_downcase
                      ) as $lang
                      | $lang == "en"
                      or $lang == "english"
                      or $lang == "multi"
                      or $lang == "all"
                      or ($lang | startswith("en-"))
                    )
                  )
              )
          ' index.json > index.json.new
          mv index.json.new index.json

      - name: Remove blacklisted extensions
        run: |
          jq --argfile bl blacklist.txt '
            .extensionList.extensions =
              (
                .extensionList.extensions
                | map(select(.name as $n | ($bl | index($n)) | not))
              )
          ' index.json > index.json.new
          mv index.json.new index.json

      - name: Update pending list
        run: |
          # Extract all extension names after filtering
          jq -r '.extensionList.extensions[].name' index.json > current.txt

          # Add new ones to pending
          while read EXT; do
            if ! grep -qxF "$EXT" approved.txt && \
               ! grep -qxF "$EXT" blacklist.txt && \
               ! grep -qxF "$EXT" pending.txt; then
              echo "$EXT" >> pending.txt
            fi
          done < current.txt

      - name: Regenerate index.min.json
        run: |
          jq '
            .extensionList.extensions
            | map({
                name,
                packageName,
                versionName,
                versionCode,
                extensionLib,
                contentWarning,
                sources
              })
          ' index.json > index.min.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json pending.txt
          git commit -m "Sync + Filter + Moderation update" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
