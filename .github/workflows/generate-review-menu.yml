name: Generate Review Menu

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dynamic review workflow
        run: |
          echo "Generating review.yml from pending.txt..."

          cat > .github/workflows/review.yml << 'EOF'
name: Review Pending Extensions

on:
  workflow_dispatch:
    inputs:
      blacklist:
        description: Select one extension to BLACKLIST (others will be APPROVED)
        required: false
        type: choice
        options:
EOF

          while read EXT; do
            echo "          - \"$EXT\"" >> .github/workflows/review.yml
          done < pending.txt

          cat >> .github/workflows/review.yml << 'EOF'

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Process selections
        run: |
          SELECTED="${{ github.event.inputs.blacklist }}"
          touch approved.txt blacklist.txt

          mapfile -t PENDING < pending.txt

          for EXT in "${PENDING[@]}"; do
            if [ "$EXT" = "$SELECTED" ]; then
              grep -qxF "$EXT" blacklist.txt || echo "$EXT" >> blacklist.txt
            else
              grep -qxF "$EXT" approved.txt || echo "$EXT" >> approved.txt
            fi
          done

          > pending.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add approved.txt blacklist.txt pending.txt
          git commit -m "Reviewed pending extensions" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
EOF
