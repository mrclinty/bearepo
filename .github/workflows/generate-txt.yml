name: Generate Extension TXT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (change if you want)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo

      - name: Download upstream index.min.json
        run: |
          curl -L \
            -o index.min.json \
            https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json

      - name: Install Python
        run: sudo apt-get install -y python3

      - name: Generate TXT list
        run: python3 scripts/generate-extension-list.py

      - name: Commit TXT file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered_extensions.txt
          git commit -m "Updated filtered extension list" || echo "No changes"

      - name: Push changes
        run: git push origin repo
