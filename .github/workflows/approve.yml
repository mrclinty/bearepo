name: Approve Extensions

on:
  workflow_dispatch:
    inputs:
      extension_names:
        description: "Extensions to approve (space-separated)"
        required: true
        type: string

jobs:
  approve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert input to list
        run: |
          echo "${{ github.event.inputs.extension_names }}" | tr ' ' '\n' > approve.txt

      - name: Fuzzy match against pending
        run: |
          rm -f resolved.txt
          touch resolved.txt

          while IFS= read -r INPUT; do
            MATCH=$(grep -i "$INPUT" pending.txt | head -n 1)
            if [ -z "$MATCH" ]; then
              echo "Not found in pending: $INPUT"
              exit 1
            fi
            echo "$MATCH" >> resolved.txt
          done < approve.txt

      - name: Add approved extensions to extension-list.txt
        run: |
          cat resolved.txt >> extension-list.txt
          sort -u extension-list.txt -o extension-list.txt

      - name: Remove approved from pending.txt
        run: |
          cp pending.txt pending.tmp
          while IFS= read -r NAME; do
            grep -i -v "$NAME" pending.tmp > pending.new
            mv pending.new pending.tmp
          done < resolved.txt
          mv pending.tmp pending.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension-list.txt pending.txt
          git commit -m "Approved extensions: $(tr '\n' ' ' < resolved.txt)" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
