name: Review Pending Extensions

on:
  workflow_dispatch:
    inputs:
      blacklist:
        description: "Space-separated list of extensions to BLACKLIST (others will be APPROVED)"
        required: false
        type: string

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show pending list
        run: |
          echo "====================================="
          echo "           PENDING EXTENSIONS"
          echo "====================================="
          if [ -s pending.txt ]; then
            cat pending.txt
          else
            echo "(none)"
          fi
          echo "====================================="

      - name: Process selections
        run: |
          touch approved.txt blacklist.txt

          # Split input by SPACES instead of commas
          IFS=' ' read -ra BLACKLIST <<< "${{ github.event.inputs.blacklist }}"

          # Normalize whitespace
          CLEAN_BL=()
          for item in "${BLACKLIST[@]}"; do
            CLEAN_BL+=("$(echo "$item" | xargs)")
          done

          # Load pending list
          mapfile -t PENDING < pending.txt

          echo "Blacklisting:"
          printf '%s\n' "${CLEAN_BL[@]}"

          echo "Approving:"
          for EXT in "${PENDING[@]}"; do
            if printf '%s\n' "${CLEAN_BL[@]}" | grep -qxF "$EXT"; then
              echo "$EXT" >> blacklist.txt
            else
              echo "$EXT" >> approved.txt
              echo "$EXT"
            fi
          done

          # Clear pending
          > pending.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add approved.txt blacklist.txt pending.txt
          git commit -m "Reviewed pending extensions" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo
