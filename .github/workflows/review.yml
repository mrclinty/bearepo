name: Review Pending Extensions

on:
  workflow_dispatch:
    inputs:
      blacklist:
        description: "Semicolon-separated list of extensions to BLACKLIST"
        required: false
        type: string

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show pending list
        run: |
          echo "====================================="
          echo "           PENDING EXTENSIONS"
          echo "====================================="
          if [ -s pending.txt ]; then
            cat pending.txt
          else
            echo "(none)"
          fi
          echo "====================================="

      - name: Process selections
        run: |
          touch approved.txt blacklist.txt pending.txt

          # Split input by semicolons
          IFS=';' read -ra CLEAN_BL <<< "${{ github.event.inputs.blacklist }}"

          # Trim whitespace
          for i in "${!CLEAN_BL[@]}"; do
            CLEAN_BL[$i]="$(echo "${CLEAN_BL[$i]}" | xargs)"
          done

          echo "Blacklisting:"
          printf '%s\n' "${CLEAN_BL[@]}"

          # Load pending and approved lists
          mapfile -t PENDING < pending.txt
          mapfile -t APPROVED < approved.txt

          # 1. Process pending items
          > approved.new
          for EXT in "${PENDING[@]}"; do
            if printf '%s\n' "${CLEAN_BL[@]}" | grep -qxF "$EXT"; then
              echo "$EXT" >> blacklist.txt
            else
              echo "$EXT" >> approved.new
            fi
          done

          # 2. Process approved items
          > approved.final
          for EXT in "${APPROVED[@]}"; do
            if printf '%s\n' "${CLEAN_BL[@]}" | grep -qxF "$EXT"; then
              echo "$EXT" >> blacklist.txt
            else
              echo "$EXT" >> approved.final
            fi
          done

          mv approved.final approved.txt

          # Clear pending
          > pending.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add approved.txt blacklist.txt pending.txt
          git commit -m "Reviewed pending extensions" || echo "No changes"

      - name: Push changes
        run: |
          git push origin repo

