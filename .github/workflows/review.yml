      - name: Process selections
        run: |
          touch approved.txt blacklist.txt

          # Split input by spaces instead of commas
          IFS=' ' read -ra BLACKLIST <<< "${{ github.event.inputs.blacklist }}"

          # Normalize whitespace
          CLEAN_BL=()
          for item in "${BLACKLIST[@]}"; do
            CLEAN_BL+=("$(echo "$item" | xargs)")
          done

          # Load pending list
          mapfile -t PENDING < pending.txt

          echo "Blacklisting:"
          printf '%s\n' "${CLEAN_BL[@]}"

          echo "Approving:"
          for EXT in "${PENDING[@]}"; do
            if printf '%s\n' "${CLEAN_BL[@]}" | grep -qxF "$EXT"; then
              echo "$EXT" >> blacklist.txt
            else
              echo "$EXT" >> approved.txt
              echo "$EXT"
            fi
          done

          # Clear pending
          > pending.txt
