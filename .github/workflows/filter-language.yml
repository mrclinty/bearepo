name: Filter Non-English Extensions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter index.json (object structure)
        id: filter_json
        run: |
          REMOVED=$(jq -r '
            .extensionList.extensions
            | map(select([.sources[].language] | index("en") | not))
            | .[].name
          ' index.json)

          jq '
            .extensionList.extensions |= map(select([.sources[].language] | index("en")))
          ' index.json > index.json.tmp
          mv index.json.tmp index.json

          echo "removed_json<<EOF" >> $GITHUB_OUTPUT
          echo "$REMOVED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Filter index.min.json (array structure)
        id: filter_min
        run: |
          REMOVED_MIN=$(jq -r '
            map(select([.sources[].language] | index("en") | not))
            | .[].name
          ' index.min.json)

          jq '
            map(select([.sources[].language] | index("en")))
          ' index.min.json > index.min.json.tmp
          mv index.min.json.tmp index.min.json

          echo "removed_min<<EOF" >> $GITHUB_OUTPUT
          echo "$REMOVED_MIN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: ${{ steps.filter_json.outputs.removed_json != '' || steps.filter_min.outputs.removed_min != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json
          git commit -m "Removed non-English extensions" || echo "No changes"

      - name: Push changes
        if: ${{ steps.filter_json.outputs.removed_json != '' || steps.filter_min.outputs.removed_min != '' }}
        run: |
          git push origin repo

      - name: Notify removal
        if: ${{ steps.filter_json.outputs.removed_json != '' || steps.filter_min.outputs.removed_min != '' }}
        run: |
          gh issue create \
            --title "Non-English Extensions Removed" \
            --body "Removed from index.json:\n${{ steps.filter_json.outputs.removed_json }}\n\nRemoved from index.min.json:\n${{ steps.filter_min.outputs.removed_min }}" \
            --label language-filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
