name: Filter Non-English Extensions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter index.json
        id: filter
        run: |
          REMOVED=$(jq -r '
            map(select(.sources[].language != "en")) | .[].name
          ' index.json)

          jq '
            map(select(.sources[].language == "en"))
          ' index.json > index.json.tmp
          mv index.json.tmp index.json

          jq '
            map(select(.sources[].language == "en"))
          ' index.min.json > index.min.json.tmp
          mv index.min.json.tmp index.min.json

          echo "removed<<EOF" >> $GITHUB_OUTPUT
          echo "$REMOVED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: ${{ steps.filter.outputs.removed != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json
          git commit -m "Removed non-English extensions" || echo "No changes"

      - name: Push changes
        if: ${{ steps.filter.outputs.removed != '' }}
        run: |
          git push origin repo

      - name: Notify removal
        if: ${{ steps.filter.outputs.removed != '' }}
        run: |
          gh issue create \
            --title "Non-English Extensions Removed" \
            --body "The following extensions were removed:\n${{ steps.filter.outputs.removed }}" \
            --label language-filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
