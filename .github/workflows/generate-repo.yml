name: Generate Repo JSON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build repo.json from approved list
        run: |
          echo "Building repo.json..."

          # Load approved list
          mapfile -t APPROVED < approved.txt

          # Start JSON
          echo '{' > repo.json
          echo '  "name": "BearRepo",' >> repo.json
          echo '  "repoUrl": "https://raw.githubusercontent.com/mrclinty/bearepo/repo/",' >> repo.json
          echo '  "extensions": [' >> repo.json

          FIRST=true

          # Loop through extension folders
          for EXT in "${APPROVED[@]}"; do
            FOLDER="extensions/$EXT"

            if [ -d "$FOLDER" ]; then
              MANIFEST="$FOLDER/manifest.json"

              if [ -f "$MANIFEST" ]; then
                # Add comma between entries
                if [ "$FIRST" = false ]; then
                  echo ',' >> repo.json
                fi
                FIRST=false

                # Insert manifest.json content directly
                cat "$MANIFEST" >> repo.json
              fi
            fi
          done

          echo '  ]' >> repo.json
          echo '}' >> repo.json

      - name: Commit repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Updated repo.json from approved list" || echo "No changes"
          git push origin repo

